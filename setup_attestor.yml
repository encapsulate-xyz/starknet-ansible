---
- name: Set up Starknet attestor
  hosts: all
  become: true
  gather_facts: true
  vars:
    allowed_node_types: [attestor]
  vars_files:
    - group_vars/all.yml
    - group_vars/vault.yml
    - group_vars/{{ env }}.yml

  pre_tasks:
    - name: Setup Pre Tasks
      when: type in allowed_node_types
      block:
        - name: Include environment setup tasks
          ansible.builtin.include_tasks: tasks/setup_environment.yml

  tasks:
    - name: Run attestor role
      when: type in allowed_node_types
      block:
        - name: Include common handlers
          ansible.builtin.include_role:
            name: common
        - name: Include attestor role
          ansible.builtin.include_role:
            name: attestor
            public: true

  post_tasks:
    - name: Verify attestor
      when: type in allowed_node_types
      block:
        # The attestor prints its crate version, without the leading v
        - name: Include verify service task
          ansible.builtin.include_tasks: tasks/verify_service.yml
          vars:
            log_file_path: "{{ attestor_log_file_path }}"
            version_command: "{{ attestor_bin_dir }}/{{ service_identifier }} --version"
            expected_version: "{{ starknet.attestor.version | regex_replace('^v', '') }}"
            health_url: "http://localhost:{{ starknet.attestor.ports.metrics_port }}/metrics"
