---
- name: Snapshot sync
  hosts: all
  become: true
  gather_facts: true
  vars:
    allowed_node_types: [node]
  vars_files:
    - group_vars/all.yml
    - group_vars/vault.yml
    - group_vars/{{ env }}.yml

  pre_tasks:
    - name: Setup environment
      when: type in allowed_node_types
      block:
        - name: Include environment setup tasks
          ansible.builtin.include_tasks: tasks/setup_environment.yml

  tasks:
    - name: Run snapshot sync role
      when: type in allowed_node_types
      block:
        - name: Include common handlers
          ansible.builtin.include_role:
            name: common
        - name: Include snapshot sync role
          ansible.builtin.include_role:
            name: snapshot_sync
            public: true

  post_tasks:
    - name: Verify node
      when: type in allowed_node_types
      block:
        # Running check only: the binary is unchanged, and pathfinder opens its monitor port
        # only after migrating the restored database, which can take longer than the check waits
        - name: Include verify service task
          ansible.builtin.include_tasks: tasks/verify_service.yml
          vars:
            log_file_path: "{{ snapshot_sync_home_dir }}/log/{{ service_identifier }}.log"
